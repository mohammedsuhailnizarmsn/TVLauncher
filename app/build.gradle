plugins {
    id 'com.android.application'
}

android {
    namespace 'com.applestyle.launcher'
    compileSdk 33

    defaultConfig {
        applicationId "com.applestyle.launcher"
        minSdk 30
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.google.android.material:material:1.5.0'
}
